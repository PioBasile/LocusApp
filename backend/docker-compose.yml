services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: user_go
      POSTGRES_PASSWORD: password_go
      POSTGRES_DB: travelshare_db
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./uploads:/app/uploads 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_go -d travelshare_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    privileged: true        
    security_opt:
      - no-new-privileges

  api:
    build: .
    ports:
      - "6767:8080"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: user_go
      DB_PASSWORD: password_go
      DB_NAME: travelshare_db
    volumes:
      - ./uploads:/app/uploads
    privileged: true       
    security_opt:
      - no-new-privileges
